<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Student Dashboard - Reset Password</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container single-panel">
        <div class="auth-right full-width">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="brand-icon small"><i class="fas fa-graduation-cap"></i></div>
                    <h2>Reset Password</h2>
                    <p>Create a new secure password</p>
                </div>
                <form id="resetForm">
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> New Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" placeholder="Min 6 characters" required>
                            <i class="fas fa-eye toggle-pw" onclick="togglePassword('password', this)"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Confirm Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirmPassword" placeholder="Repeat password" required>
                            <i class="fas fa-eye toggle-pw" onclick="togglePassword('confirmPassword', this)"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" id="resetBtn">
                        <span>Reset Password</span><i class="fas fa-check"></i>
                    </button>
                    <div id="resetMsg" class="alert-msg"></div>
                </form>
            </div>
        </div>
    </div>
    <script src="../js/auth.js"></script>
</body>
</html>
