<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Login</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-left">
        <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
        <h1>Smart Student<br>Dashboard</h1>
        <p>Track marks, attendance & exams in one place</p>
        <div class="features">
            <div class="feat"><i class="fas fa-chart-bar"></i> Marks & Grades</div>
            <div class="feat"><i class="fas fa-calendar-check"></i> Attendance</div>
            <div class="feat"><i class="fas fa-file-alt"></i> Exam Schedule</div>
            <div class="feat"><i class="fas fa-tasks"></i> Assignments</div>
        </div>
    </div>
    <div class="auth-right">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back!</h2>
                <p>Sign in to your student account</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Student Name / Email</label>
                    <input type="text" id="email" placeholder="Enter your name or email" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <i class="fas fa-eye toggle-pw" onclick="togglePw('password',this)"></i>
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember"><input type="checkbox"> Remember me</label>
                    <a href="forgot-password.html" class="forgot">Forgot Password?</a>
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">
                    <span>Sign In</span><i class="fas fa-arrow-right"></i>
                </button>
                <div id="loginMsg" class="msg"></div>
            </form>
            <div class="auth-footer">
                Don't have an account? <a href="register.html">Create Account</a>
            </div>
        </div>
    </div>
</div>
<script src="../js/auth.js"></script>
</body>
</html>
