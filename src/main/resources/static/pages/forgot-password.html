<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Forgot Password</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="auth-container single-panel">
    <div class="auth-right full-width">
        <div class="auth-card">
            <div class="auth-header">
                <a href="login.html" class="back-link" title="Back to Login" aria-label="Back to Login"><i class="fas fa-arrow-left" aria-hidden="true"></i></a>
                <div class="brand-icon small"><i class="fas fa-graduation-cap"></i></div>
                <h2>Forgot Password?</h2>
                <p>Enter your email to receive a reset link</p>
            </div>
            <form id="forgotForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Registered Email</label>
                    <input type="email" id="email" placeholder="Enter your registered email" required>
                </div>
                <button type="submit" class="btn-primary" id="forgotBtn">
                    <span>Send Reset Link</span><i class="fas fa-paper-plane"></i>
                </button>
                <div id="forgotMsg" class="msg"></div>
            </form>
            <div class="auth-footer">
                Remembered it? <a href="login.html">Back to Sign In</a>
            </div>
        </div>
    </div>
</div>
<script src="../js/auth.js"></script>
</body>
</html>
